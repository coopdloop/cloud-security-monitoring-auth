<!-- frontend/public/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.3/dist/full.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center">Welcome Back</h1>

    <!-- Google OAuth Login -->
    <div class="mb-4">
      <a href="/login"
        class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-gray-700 hover:bg-gray-50">
        <img src="https://cdn.cdnlogo.com/logos/g/35/google-icon.svg" alt="Google" class="w-5 h-5 mr-2">
        Continue with Google
      </a>
    </div>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-gray-500">Or</span>
      </div>
    </div>

    <!-- Passwordless Login -->
    <div id="loginContainer">
      <div class="mb-4">
        <input type="email" id="email" placeholder="Enter your email"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button onclick="startPasswordlessLogin()"
        class="w-full bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Continue with Email
      </button>
    </div>
  </div>

  <script>
    // Store email for verification step
    let currentEmail = '';

    async function startPasswordlessLogin() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        alert('Please enter your email address');
        return;
      }

      try {
        const response = await fetch('/passwordless/start', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({email})
        });

        if (!response.ok) {
          throw new Error('Failed to start passwordless login');
        }

        // Store email for verification
        currentEmail = email;

        // Show verification code input
        const container = document.querySelector('.bg-white');
        container.innerHTML = `
                    <h2 class="text-xl font-bold mb-4">Check Your Email</h2>
                    <p class="mb-4">We've sent a verification code to ${email}</p>
                    <input type="text" id="code" placeholder="Enter verification code"
                           class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-md">
                    <button onclick="verifyCode()"
                            class="w-full bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                        Verify Code
                    </button>
                    <button onclick="goBack()"
                            class="w-full mt-2 text-gray-600 hover:text-gray-800">
                        Back to Login
                    </button>
                `;
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    async function verifyCode() {
      const code = document.getElementById('code').value.trim();
      if (!code) {
        alert('Please enter the verification code');
        return;
      }

      try {
        const response = await fetch('/passwordless/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            code,
            email: currentEmail  // Include the stored email
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Invalid verification code');
        }

        const data = await response.json();

        // Store tokens
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('id_token', data.id_token);

        // Redirect to dashboard on success
        window.location.href = '/dashboard.html';
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function goBack() {
      window.location.reload();
    }
  </script>
</body>
</html>
